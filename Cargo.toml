[package]
name = "blockexplorer-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
bytes = "1.11.1"
crossterm = "0.29.0"
directories = "6.0.0"
hex = "0.4.3"
moka = { version = "0.12.15", features = ["future"] }
ratatui = "0.30.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "gzip", "stream", "http2", "charset"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
assert_matches = "1.5.0"
cucumber = "0.22.1"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
tokio = { version = "1.52.1", features = ["test-util"] }
wiremock = "0.6.5"

[[test]]
name = "e2e"
harness = false
