name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Warm the dep cache *before* we drop network on the test steps.
      # If this step fails we want a loud signal ("cargo fetch failed")
      # rather than silently dying in a sandboxed test run.
      - name: cargo fetch
        run: cargo fetch --locked

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # --- Tests run with the network namespace torn down. -------
      #
      # `sudo unshare -n` creates a **network** namespace only (no `-r`
      # user-namespace remap). GitHub-hosted runners reject `unshare -rn`
      # with `write failed /proc/self/uid_map: Operation not permitted`.
      # External routes are absent; accidental RPC calls fail with
      # ENETUNREACH. `lo` starts DOWN — bring it up for wiremock on
      # 127.0.0.1.
      #
      # `sudo` resets `PATH` (no rustup `cargo`). Forward PATH plus the
      # job-level Rust env vars into the sandboxed shell.
      - name: cargo test --lib --bins  (no network)
        run: >-
          sudo env "PATH=$PATH" "RUSTFLAGS=$RUSTFLAGS" "RUST_BACKTRACE=$RUST_BACKTRACE"
          "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          unshare -n -- bash -c 'ip link set lo up && cargo test --lib --bins --locked'

      - name: cargo test --tests  (no network)
        run: >-
          sudo env "PATH=$PATH" "RUSTFLAGS=$RUSTFLAGS" "RUST_BACKTRACE=$RUST_BACKTRACE"
          "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          unshare -n -- bash -c 'ip link set lo up && cargo test --test functional --locked'

      - name: cargo test --test e2e  (no network)
        run: >-
          sudo env "PATH=$PATH" "RUSTFLAGS=$RUSTFLAGS" "RUST_BACKTRACE=$RUST_BACKTRACE"
          "CARGO_TERM_COLOR=$CARGO_TERM_COLOR"
          unshare -n -- bash -c 'ip link set lo up && cargo test --test e2e --locked'

      - name: scripts/check-layers.sh
        run: bash scripts/check-layers.sh

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # EmbarkStudios/cargo-deny-action bundles an older cargo-deny that
      # cannot parse RustSec advisories using CVSS 4.0. Pin a current
      # release so advisory-db loads cleanly.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - name: cargo deny check
        run: cargo deny --all-features check
